# Filled by the reviewed deployment script. Contains no provider or registry password.
name: ${APP_NAME}
type: Microsoft.App/containerApps
location: ${LOCATION}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ${IDENTITY_ID}: {}
properties:
  managedEnvironmentId: ${ENVIRONMENT_ID}
  workloadProfileName: Consumption
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
    secrets:
      - name: recording-access-digest
        value: "${CREDENTIAL_SHA256}"
    registries:
      - server: ${REGISTRY_SERVER}
        identity: ${IDENTITY_ID}
  template:
    containers:
      - name: platform
        image: ${IMAGE}
        command: [node]
        args:
          - --input-type=module
          - -e
          - ${GATEWAY_SOURCE_JSON}
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: LEARNING_STARTER_SOURCE_BASE64
            value: "${STARTER_SOURCE_BASE64}"
          - name: LEARNING_RECORDING_GATEWAY
            value: "true"
          - name: LEARNING_ACCESS_SHA256
            secretRef: recording-access-digest
          - name: LEARNING_PUBLIC_ORIGIN
            value: ${PUBLIC_ORIGIN}
          - name: ANTHROPIC_API_KEY
            value: ""
          - name: AI_TUTOR_LIVE_ENABLED
            value: "false"
          - name: MANAGED_LIVE_ENABLED
            value: "false"
          - name: MILESTONE_LIVE_ENABLED
            value: "false"
          - name: INWORLD_NARRATION_ENABLED
            value: "0"
        probes:
          - type: Startup
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          - type: Readiness
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          - type: Liveness
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
    scale:
      minReplicas: 1
      maxReplicas: 1
